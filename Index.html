<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>個人日記</title>
 
<style>
:root{--bg:#faf6f0;--card:#fffdf9;--ink:#4a3f38;--sub:#9a8c80;--line:#eee4d8;--accent:#c98b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1f1b18;--card:#2a2522;--ink:#efe6dc;--sub:#a89b8f;--line:#3a332e;--accent:#d9a283}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
#root{height:100%}
.app{max-width:430px;height:100%;margin:0 auto;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;position:relative}
.hero{padding:18px 20px 22px;color:rgba(255,255,255,.82);background-size:cover;background-position:center;transition:background .5s;flex:none}
.mh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.mh h1{font-size:17px;font-weight:300;letter-spacing:.2em;margin:0}
.mh button{background:none;border:0;color:inherit;font-size:22px;font-weight:200;padding:4px 12px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
.wd{font-size:11px;opacity:.6;padding-bottom:6px;font-weight:300}
.day{height:38px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:300;border:0;background:none;color:inherit;cursor:pointer;border-radius:50%;font-family:inherit}
.day.has{font-weight:800}
.day.today{box-shadow:inset 0 0 0 1px rgba(255,255,255,.6)}
.day.sel{background:rgba(255,255,255,.18)}
.main{flex:1;overflow:auto;padding:18px 18px 28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px}
.dt{font-size:12px;color:var(--sub);letter-spacing:.1em;margin-bottom:8px}
.row{display:flex;gap:12px}
.row>div{flex:1;min-width:0}
.ttl{font-size:17px;font-weight:600;margin:0 0 6px}
.ex{font-size:14px;line-height:1.7;color:var(--ink);opacity:.85;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;margin:0;white-space:pre-wrap}
.thumb{width:68px;height:68px;border-radius:12px;object-fit:cover;flex:none}
.empty{text-align:center;color:var(--sub);font-size:14px;line-height:1.9;padding:14px 0}
.btns{display:flex;gap:10px;margin-top:14px}
.btn{flex:1;border:1px solid var(--line);background:none;color:var(--ink);border-radius:999px;padding:10px 14px;font-size:14px;cursor:pointer;font-family:inherit}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.ai{margin-top:14px;padding:12px 14px;border-radius:14px;background:rgba(201,139,107,.12);font-size:14px;line-height:1.8}
.mask{position:absolute;inset:0;background:rgba(40,30,24,.4);display:flex;align-items:flex-end;z-index:10;animation:f .2s}
.sheet{width:100%;max-height:92%;overflow:auto;background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:u .25s}
@keyframes f{from{opacity:0}}
@keyframes u{from{transform:translateY(40px);opacity:0}}
.moods{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}
.mood{border:1px solid var(--line);background:none;color:var(--ink);border-radius:14px;padding:9px 2px;font-size:12px;cursor:pointer;font-family:inherit}
.mood.on{background:rgba(201,139,107,.18);border-color:var(--accent)}
.mood span{display:block;font-size:20px;margin-bottom:2px}
.in{width:100%;border:0;border-bottom:1px solid var(--line);background:none;color:var(--ink);font-size:17px;padding:8px 0;margin-bottom:10px;font-family:inherit;outline:none}
textarea.in{border:1px solid var(--line);border-radius:12px;padding:12px;font-size:15px;line-height:1.8;height:150px;resize:none}
.photo{width:100%;border-radius:14px;margin-top:10px;display:block;max-height:220px;object-fit:cover}
.quote{margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);text-align:center}
.quote p{margin:0;font-family:Georgia,"Times New Roman",serif;font-style:italic;font-size:15px;line-height:1.6}
.quote small{display:block;margin-top:6px;color:var(--sub);font-size:12px}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:12px;margin-bottom:10px;opacity:.9}
.gear{background:none;border:0;color:inherit;font-size:12px;letter-spacing:.1em;cursor:pointer;padding:2px 0;font-family:inherit}
.fld{display:block;font-size:13px;color:var(--sub);margin:12px 0 4px}
.fld small{display:block;line-height:1.6;margin-top:2px}
.fld .in{color:var(--ink);font-size:15px;margin-bottom:2px}
</style>
</head>

 {g:['#e5b97a','#f6e3c2'],img:''},{g:['#e0a47a','#f5d8bf'],img:''},{g:['#c9b27c','#ece0bd'],img:''},

function quoteFor(y,m,d){return QUOTES[(Math.floor(Date.UTC(y,m-1,d)/864e5)*17)%QUOTES.length];}
const ADVICE={
 '😊':['看得出今天心情很好！把這份喜悅好好收藏起來，未來低落時翻開，它會成為你的小太陽。','開心的日子值得被記住。也別忘了謝謝今天那個努力又閃閃發光的自己。'],

 '☕':['輕鬆的一天剛剛好。偶爾放慢腳步，也是在好好照顧自己。','像一杯溫熱的咖啡，今天的你很自在。記得留點時間給喜歡的小事。'],
 '☁️':['累了就先休息，今天不用完美。你願意把感受寫下來，已經很棒了。','雲總會散去。喝點溫熱的飲料、早點睡，明天的你會感謝現在善待自己的你。'],
 '':['不論今天發生了什麼，你願意停下來記錄，就是在溫柔地陪伴自己。']

const pad=n=>String(n).padStart(2,'0');
const keyOf=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const pick=a=>a[Math.floor(Math.random()*a.length)];
const hasContent=e=>!!e&&!!(e.title||e.text||e.photo);

function compress(file){
 return new Promise((res,rej)=>{
  const r=new FileReader();
  r.onerror=rej;
  r.onload=()=>{const im=new Image();im.onerror=rej;
   im.onload=()=>{const s=Math.min(1,800/Math.max(im.width,im.height));
    const c=document.createElement('canvas');c.width=im.width*s;c.height=im.height*s;
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);res(c.toDataURL('image/jpeg',0.72));};
   im.src=r.result;};
  r.readAsDataURL(file);
 });
}

function useAdvice(){
 const [t,setT]=useState('');const [busy,setBusy]=useState(false);
 const ask=async(d)=>{
  const title=(d.title||'').trim(),body=(d.text||'').trim(),mood=d.mood||'';
  if(!title&&!body&&!mood){setT('先寫下一點點什麼吧，哪怕只是選一個心情，我就能更貼近你的今天 🌿');return;}
  setBusy(true);setT('');
  const label=(MOODS.find(x=>x[0]===mood)||[,'未選擇'])[1];
  try{
   const sample=await claude.use('sample');
   if(!sample)throw new Error('na');
   const prompt='你是一位溫柔、具同理心、有心理療癒素養的陪伴者。請閱讀下面這則個人日記，用繁體中文寫一段 80 到 140 字的溫暖回饋：先具體呼應日記中提到的內容與情緒，再給一個小而可行的鼓勵或建議。語氣像親近的朋友，不說教、不下診斷、不使用條列或標題，只輸出回饋本身。\n\n心情：'+label+'\n標題：'+(title||'（無）')+'\n內文：'+(body||'（無）');
   const r=await sample(prompt,{modelTier:'quick',cache:false,onText:s=>{setBusy(false);setT(s.text);}});
   setT(r.text);
  }catch(_){setT(pick(ADVICE[mood]||ADVICE[''])+'（目前無法連線 AI，這是備用的溫柔小語）');}
  setBusy(false);
 };
 return [t,busy,ask,setT];
}

function Editor({dateKey,entry,onSave,onClose}){
 const [d,setD]=useState({title:'',mood:'',text:'',photo:'',...entry});
 const [adv,busy,ask]=useAdvice();
 const set=(k,v)=>setD(p=>({...p,[k]:v}));
 const [y,m,dd]=dateKey.split('-').map(Number);
 const q=quoteFor(y,m,dd);
 const onFile=async e=>{const f=e.target.files[0];if(!f)return;try{set('photo',await compress(f));}catch(_){alert('照片讀取失敗，請換一張試試');}e.target.value='';};
 return html`<div className="mask" onClick=${onClose}>
  <div className="sheet" onClick=${e=>e.stopPropagation()}>
   <div className="dt">${y} 年 ${m} 月 ${dd} 日 ・ 星期${WD[new Date(y,m-1,dd).getDay()]}</div>
   <div className="moods">${MOODS.map(([e,l])=>html`<button key=${e} className=${'mood'+(d.mood===e?' on':'')} onClick=${()=>set('mood',d.mood===e?'':e)}><span>${e}</span>${l}</button>`)}</div>
   <input className="in" placeholder="今天的標題…" value=${d.title} onChange=${e=>set('title',e.target.value)} />
   <textarea className="in" placeholder="寫下今天的心情與故事…" value=${d.text} onChange=${e=>set('text',e.target.value)}></textarea>
   <div className="btns">
    <label className="btn" style=${{textAlign:'center'}}>🖼 ${d.photo?'更換照片':'上傳照片'}<input type="file" accept="image/*" hidden onChange=${onFile} /></label>
    <label className="btn" style=${{textAlign:'center'}}>📷 拍照<input type="file" accept="image/*" capture="environment" hidden onChange=${onFile} /></label>
    ${d.photo&&html`<button className="btn" onClick=${()=>set('photo','')}>移除照片</button>`}
   </div>
   ${d.photo&&html`<img className="photo" src=${d.photo} alt="" />`}
   <button className="btn" style=${{width:'100%',marginTop:12}} onClick=${()=>ask(d)}>✨ 請 AI 給我溫暖建議</button>
   ${(busy||adv)&&html`<div className="ai">${busy?'AI 正在輕輕想著你的話…':adv}</div>`}
   <div className="btns"><button className="btn" onClick=${onClose}>關閉</button><button className="btn pri" onClick=${()=>onSave(d)}>儲存</button></div>
   <div className="quote"><p>“${q[0]}”</p><small>${q[1]}</small></div>
  </div></div>`;
}

function Settings({code,akey,ready,st,onSave,onClose}){
 const [c,setC]=useState(code),[k,setK]=useState(akey);
 const gen=()=>{const a=new Uint8Array(12);crypto.getRandomValues(a);setC(Array.from(a,b=>b.toString(36).padStart(2,'0')).join(''));};
 return html`<div className="mask" onClick=${onClose}><div className="sheet" onClick=${e=>e.stopPropagation()}>
  <div className="dt" style=${{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
   <span>⚙︎ 設定</span>
   <span style=${{fontSize:'13px',fontWeight:'normal',padding:'4px 8px',background:'rgba(201,139,107,0.15)',borderRadius:'8px'}}>${st}</span>
  </div>

  <label className="fld">☁️ 雲端同步代碼
   <input className="in" value=${c} placeholder="每台裝置填入相同代碼" onChange=${e=>setC(e.target.value.replace(/[\/\s]/g,''))} />
   <small>${ready?'兩台裝置填入相同的代碼，日記就會自動同步。代碼等同密碼，請設長一點並妥善保管。':'尚未填寫 firebaseConfig，請依檔案開頭的說明貼入設定後，雲端同步才會啟用。'}</small>
  </label>
  <button className="btn" style=${{width:'100%'}} onClick=${gen}>🎲 產生隨機代碼</button>
  <label className="fld" style=${{marginTop:18}}>🔑 Anthropic API Key（僅存於本機）
   <input className="in" type="password" autoComplete="off" placeholder="sk-ant-…" value=${k} onChange=${e=>setK(e.target.value.trim())} />
   <small>目前只先儲存、尚未啟用，AI 建議暫時仍顯示備用小語。</small>
  </label>
  <div className="btns"><button className="btn" onClick=${onClose}>關閉</button><button className="btn pri" onClick=${()=>onSave(c,k)}>儲存</button></div>
 </div></div>`;
}

function App(){
 const now=new Date();
 const [ym,setYm]=useState({y:now.getFullYear(),m:now.getMonth()});
 const [sel,setSel]=useState(keyOf(now.getFullYear(),now.getMonth(),now.getDate()));
 const [open,setOpen]=useState(false);
 const [entries,setEntries]=useState(()=>{try{return JSON.parse(localStorage.getItem('diary-v1')||'{}');}catch(_){return {};}});
 const [adv,busy,ask,setAdv]=useAdvice();
 useEffect(()=>{setAdv('');},[sel]);
 const [code,setCode]=useState(()=>localStorage.getItem('diary-sync')||'');
 const [akey,setAkey]=useState(()=>localStorage.getItem('diary-akey')||'');
 const [cfg,setCfg]=useState(false);
 const [st,setSt]=useState('');
 const cloud=CLOUD_READY&&!!code;
 useEffect(()=>{
  if(!cloud){setSt(CLOUD_READY?'📱 僅存本機（尚未設定同步代碼）':'📱 僅存本機');return;}
  let ref;
  try{ref=entriesRef(code);}catch(_){setSt('⚠️ Firebase 設定有誤或無法連線');return;}
  setSt('☁️ 連線中…');
  const listener = ref.on('value', snap => {
   const remote = snap.val() || {};
   setEntries(prev => {
    const next = {...remote};
    Object.keys(prev).forEach(k => {
     const a = prev[k], b = remote[k];
     if(!b || (a.updatedAt||0) > (b.updatedAt||0)){
       next[k] = a;
       ref.child(k).set(a).catch(()=>{});
     }
    });
    try{localStorage.setItem('diary-v1',JSON.stringify(next));}catch(_){}
    return next;
   });
   setSt('☁️ 已同步');
  }, err => setSt('⚠️ 同步失敗：'+(err.code||'請檢查設定')));
  return () => ref.off('value', listener);

 },[code]);
 const saveCfg=(c,k)=>{localStorage.setItem('diary-sync',c);localStorage.setItem('diary-akey',k);setCode(c);setAkey(k);setCfg(false);};

 const save=d=>{
  const v={...d,updatedAt:Date.now()};
  const next={...entries,[sel]:v};
  try{localStorage.setItem('diary-v1',JSON.stringify(next));}catch(_){if(!cloud){alert('儲存空間不足，請移除部分照片後再試');return;}}
  setEntries(next);setOpen(false);
  if(cloud){
   setSt('☁️ 同步中…');
   try{entriesRef(code).child(sel).set(v).then(()=>setSt('☁️ 已同步')).catch(e=>setSt('⚠️ 同步失敗：'+(e.code||'請檢查設定')));}
   catch(_){setSt('⚠️ Firebase 設定有誤或無法連線');}
  }
 };
 const th=MONTH_THEMES[ym.m];
 const bg=th.img?'url('+th.img+')':'linear-gradient(160deg,'+th.g[0]+','+th.g[1]+')';
 const first=new Date(ym.y,ym.m,1).getDay();
 const days=new Date(ym.y,ym.m+1,0).getDate();
 const cells=[...Array(first).fill(null),...Array.from({length:days},(_,i)=>i+1)];
 const move=n=>{const d=new Date(ym.y,ym.m+n,1);setYm({y:d.getFullYear(),m:d.getMonth()});};
 const todayKey=keyOf(now.getFullYear(),now.getMonth(),now.getDate());
 const e=entries[sel];const [sy,sm,sd]=sel.split('-').map(Number);

 return html`<div className="app">
  <div className="hero" style=${{background:bg,backgroundSize:'cover',backgroundPosition:'center'}}>
   <div className="bar"><button className="gear" onClick=${()=>setCfg(true)}>⚙︎ 設定</button><span>${st}</span></div>
   <div className="mh"><button onClick=${()=>move(-1)}>‹</button><h1>${ym.y} ・ ${ym.m+1} 月</h1><button onClick=${()=>move(1)}>›</button></div>
   <div className="grid">
    ${WD.map(w=>html`<div key=${w} className="wd">${w}</div>`)}
    ${cells.map((d,i)=>{
     if(!d)return html`<div key=${'e'+i}></div>`;
     const k=keyOf(ym.y,ym.m,d);
     return html`<button key=${k} className=${'day'+(hasContent(entries[k])?' has':'')+(k===todayKey?' today':'')+(k===sel?' sel':'')} onClick=${()=>{setSel(k);setOpen(true);}}>${d}</button>`;
    })}
   </div>
  </div>
  <div className="main">
   <div className="card">
    <div className="dt">${sm} 月 ${sd} 日${sel===todayKey?' ・ 今天':''}</div>
    ${hasContent(e)?html`
     <div className="row">
      <div>
       <h2 className="ttl">${e.mood} ${e.title||'（未命名）'}</h2>
       <p className="ex">${e.text||'這天只留下了一張照片。'}</p>
      </div>
      ${e.photo&&html`<img className="thumb" src=${e.photo} alt="" />`}
     </div>
     <div className="btns">
      <button className="btn" onClick=${()=>setOpen(true)}>編輯</button>
      <button className="btn" onClick=${()=>ask(e)}>✨ 請 AI 給我溫暖建議</button>
     </div>
     ${(busy||adv)&&html`<div className="ai">${busy?'AI 正在輕輕想著你的話…':adv}</div>`}
    `:html`
     <div className="empty">這一天還是一頁空白 🌿<br/>點一下日期，寫下今天的心情吧。</div>
     <div className="btns"><button className="btn pri" onClick=${()=>setOpen(true)}>開始寫日記</button></div>
    `}
   </div>
  </div>
  ${open&&html`<${Editor} key=${sel} dateKey=${sel} entry=${e} onSave=${save} onClose=${()=>setOpen(false)} />`}
  ${cfg&&html`<${Settings} code=${code} akey=${akey} ready=${CLOUD_READY} st=${st} onSave=${saveCfg} onClose=${()=>setCfg(false)} />`}

 </div>`;
}
ReactDOM.createRoot(document.getElementById('root')).render(html`<${App} />`);
</script>
</body>
</html>
